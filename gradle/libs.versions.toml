[versions]
agp = "8.11.2"
kotlin = "2.2.21"
compose = "1.9.2"
composeWebView = "2.0.3"
kcef = "2024.04.20.4"
androidx-activity = "1.11.0"
androidx-test-runner = "1.6.2"
androidx-test-junit = "1.2.1"
androidx-compose-ui-test = "1.9.2"
coroutines = "1.10.2"
# Ktor pinned to the 3.3.x line: the last release built against the Kotlin 2.2 toolchain this
# project compiles with. Bump together with the Kotlin version after verifying metadata compatibility.
ktor = "3.3.3"
mockwebserver = "5.1.0"
okhttp = "5.1.0"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
compose-webview = { module = "io.github.kevinnzou:compose-webview-multiplatform", version.ref = "composeWebView" }
kcef = { module = "dev.datlag:kcef", version.ref = "kcef" }
[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
