name: Browser Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run core and app adapter tests
        run: bash gradlew :browser-core:jvmTest :browser-download:jvmTest :composeApp:desktopTest --stacktrace

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile iOS targets (Kotlin/Native requires a macOS runner)
        run: |
          bash gradlew \
            :browser-core:compileKotlinIosArm64 \
            :browser-core:compileKotlinIosSimulatorArm64 \
            :browser-download:compileKotlinIosArm64 \
            :browser-download:compileKotlinIosSimulatorArm64 \
            :composeApp:compileKotlinIosArm64 \
            :composeApp:compileKotlinIosSimulatorArm64 \
            --stacktrace

  android-emulator-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk is 37 (raised because miuix 0.9.4 requires API 37). The published SDK
          # package is named platforms;android-37.0 (not platforms;android-37); the API 35
          # emulator image is what the instrumentation run boots on.
          packages: >-
            platforms;android-37.0
            build-tools;35.0.0
            system-images;android-35;google_apis;x86_64
            emulator
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android instrumentation suite (navigation and downloads)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: false
          script: |
            # Exercise the phone-first layout at a deliberate compact 360 dp width (540x1200 px at 240 dpi).
            adb shell wm size 540x1200
            adb shell wm density 240
            adb shell wm size
            adb shell wm density
            mkdir -p composeApp/build/reports/compact-phone-smoke
            set +e
            bash gradlew :composeApp:connectedDebugAndroidTest --stacktrace
            test_result=$?
            set -e
            # Capture a reproducible post-test launch frame at the configured 360 dp viewport.
            # This is evidence for visual review, not an automated visual-acceptance claim.
            adb shell am force-stop dev.veyra.browser
            adb shell monkey -p dev.veyra.browser 1
            sleep 5
            adb exec-out screencap -p > composeApp/build/reports/compact-phone-smoke/home.png
            exit "$test_result"
      - name: Dump failing instrumentation tests
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          hit=0
          while IFS= read -r -d '' f; do
            if grep -Eq '<(failure|error)([[:space:]>])' "$f"; then
              hit=1
              echo "==================== $f ===================="
              cat "$f"
            fi
          done < <(find composeApp/build -type f -name 'TEST-*.xml' -print0 2>/dev/null)
          if [ "$hit" -eq 0 ]; then
            echo "No XML failure details found. Listing instrumentation results:"
            find composeApp/build/outputs/androidTest-results -type f -print 2>/dev/null | head -100 || true
            echo "--- test-result exit code ---"
            cat composeApp/build/outputs/androidTest-results/connected/debug/test-result-exit-code.txt 2>/dev/null || true
          fi
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results
          path: |
            composeApp/build/outputs/androidTest-results/
            composeApp/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload compact phone screenshot for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-phone-visual-smoke
          path: composeApp/build/reports/compact-phone-smoke/home.png
          if-no-files-found: warn
          retention-days: 7
